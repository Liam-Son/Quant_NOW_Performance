<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Header -->
  <text x="48" y="64" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#ffffff">Quant_NOW Performance</text>
  <text x="48" y="96" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#94a3b8">Track the historical performance of the proprietary NOW Index</text>
  <!-- Metric cards -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="130" width="250" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="70" y="160" font-size="13" fill="#94a3b8">Current NOW Index Value</text>
    <text x="70" y="196" font-size="26" font-weight="bold" fill="#ffffff">249.50</text>
    <rect x="318" y="130" width="250" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="340" y="160" font-size="13" fill="#94a3b8">YTD Return</text>
    <text x="340" y="196" font-size="26" font-weight="bold" fill="#38bdf8">+16.4%</text>
    <rect x="588" y="130" width="250" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="610" y="160" font-size="13" fill="#94a3b8">Since Inception Return</text>
    <text x="610" y="196" font-size="26" font-weight="bold" fill="#4ade80">+149.5%</text>
    <rect x="858" y="130" width="294" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="880" y="160" font-size="13" fill="#94a3b8">Investment Growth Snapshot</text>
    <text x="880" y="196" font-size="26" font-weight="bold" fill="#38bdf8">$51,524</text>
  </g>
  <!-- Chart placeholder -->
  <rect x="48" y="250" width="700" height="330" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="282" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0">NOW Index Performance</text>
  <!-- Simple line chart -->
  <polyline points="70,430 130,400 200,380 270,360 340,330 410,300 480,270 550,250 620,240 700,220"
            fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="70,430 130,420 200,410 270,400 340,390 410,380 480,370 550,360 620,350 700,340"
            fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4"/>
  <text x="70" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">2020</text>
  <text x="250" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">2022</text>
  <text x="450" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">2024</text>
  <text x="640" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">2025</text>
  <!-- Side panel -->
  <rect x="770" y="250" width="382" height="330" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="792" y="282" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#e2e8f0">Risk Analytics</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="792" y="320" font-size="13" fill="#94a3b8">CAGR</text><text x="1120" y="320" font-size="13" fill="#ffffff" text-anchor="end">16.5%</text>
    <text x="792" y="355" font-size="13" fill="#94a3b8">Volatility</text><text x="1120" y="355" font-size="13" fill="#ffffff" text-anchor="end">13.5%</text>
    <text x="792" y="390" font-size="13" fill="#94a3b8">Sharpe Ratio</text><text x="1120" y="390" font-size="13" fill="#ffffff" text-anchor="end">1.12</text>
    <text x="792" y="425" font-size="13" fill="#94a3b8">Max Drawdown</text><text x="1120" y="425" font-size="13" fill="#ffffff" text-anchor="end">-21.0%</text>
  </g>
  <rect x="792" y="455" width="260" height="44" rx="22" fill="#0ea5e9"/>
  <text x="922" y="483" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Open Calculator</text>
  <!-- Footer -->
  <text x="48" y="600" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#475569">github.com/Liam-Son/Quant_NOW_Performance · github.com/Liam-Son/NOW-index</text>
</svg>
